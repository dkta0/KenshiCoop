name: Build KenshiCoop kit

on:
  workflow_dispatch:
    inputs:
      releaseSmoke:
        description: Exercise the published one-click installer against GitHub latest
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-kit:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Fetch build dependencies
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/BFrizzleFoShizzle/KenshiLib_Examples_deps.git third_party/KenshiLib_deps
          git -C third_party/KenshiLib_deps apply ../kenshilib-patches/0001-vc10-header-compat.patch
          git clone --depth 1 https://github.com/lsalzman/enet.git third_party/enet/enet
          git apply third_party/enet/patches/0001-enet-c89-for-loops.patch
          git apply third_party/enet/patches/0002-enet-socket-hooks.patch
          Expand-Archive third_party/KenshiLib_deps/boost_1_60_0/boost.zip third_party/KenshiLib_deps/boost_1_60_0 -Force

      - name: Install Visual C++ 2010 x64 toolchain from SDK media
        shell: pwsh
        timeout-minutes: 15
        run: |
          # Do not run SDKSetup.exe: its obsolete .NET prerequisite dialog hangs
          # unattended Windows runners. Install only the native MSI payloads
          # directly from Microsoft's signed offline SDK media.
          $iso = Join-Path $env:RUNNER_TEMP 'GRMSDKX_EN_DVD.iso'
          $media = Join-Path $env:RUNNER_TEMP 'winsdk71-media'
          curl.exe --fail --location --retry 3 --silent --show-error `
            --output $iso `
            'https://download.microsoft.com/download/F/1/0/F10113F5-B750-4969-A255-274341AC6BCE/GRMSDKX_EN_DVD.iso'
          if ($LASTEXITCODE -ne 0) { throw "SDK ISO download failed: $LASTEXITCODE" }

          $expectedSha1 = '9203529F5F70D556A60C37F118A95214E6D10B5A'
          $actualSha1 = (Get-FileHash $iso -Algorithm SHA1).Hash
          if ($actualSha1 -ne $expectedSha1) {
            throw "SDK ISO SHA-1 mismatch: expected $expectedSha1, got $actualSha1"
          }
          & 7z.exe x $iso "-o$media" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "SDK ISO extraction failed: $LASTEXITCODE" }

          $msis = @(
            'Setup\WinSDK_amd64\WinSDK_amd64.msi',
            'Setup\WinSDKBuild_amd64\WinSDKBuild_amd64.msi',
            'Setup\WinSDKTools_amd64\WinSDKTools_amd64.msi',
            'Setup\WinSDKWin32Tools_amd64\WinSDKWin32Tools_amd64.msi',
            'Setup\vc_stdx86\vc_stdx86.msi',
            'Setup\vc_stdamd64\vc_stdamd64.msi'
          )
          foreach ($relative in $msis) {
            $msi = Join-Path $media $relative
            if (-not (Test-Path $msi)) { throw "SDK media is missing $relative" }
            $log = Join-Path $env:RUNNER_TEMP (($relative -replace '[\\.]', '_') + '.log')
            Write-Host "Installing $relative"
            $process = Start-Process msiexec.exe -ArgumentList @(
              '/i', "`"$msi`"", '/qn', '/norestart', '/L*v', "`"$log`""
            ) -PassThru -Wait
            if ($process.ExitCode -notin @(0, 1638, 3010)) {
              Get-Content $log -Tail 120
              throw "MSI install failed for $relative`: $($process.ExitCode)"
            }
          }

          $update = Join-Path $env:RUNNER_TEMP 'VC-Compiler-KB2519277.exe'
          curl.exe --fail --location --retry 3 --silent --show-error `
            --output $update `
            'https://download.microsoft.com/download/7/5/0/75040801-126C-4591-BCE4-4CD1FD1499AA/VC-Compiler-KB2519277.exe'
          if ($LASTEXITCODE -ne 0) { throw "Compiler update download failed: $LASTEXITCODE" }
          $process = Start-Process $update -ArgumentList '/quiet', '/norestart' -PassThru -Wait
          if ($process.ExitCode -notin @(0, 1, 1641, 3010)) {
            throw "VC++ 2010 compiler update failed: $($process.ExitCode)"
          }

          $compiler = 'C:\Program Files (x86)\Microsoft Visual Studio 10.0\VC\bin\amd64\cl.exe'
          $headers = 'C:\Program Files\Microsoft SDKs\Windows\v7.1\Include\Windows.h'
          if (-not (Test-Path $compiler)) { throw "v100 x64 compiler missing after setup: $compiler" }
          if (-not (Test-Path $headers)) { throw "Windows SDK 7.1 headers missing after setup: $headers" }

      - name: Build and run protocol tests
        shell: pwsh
        run: |
          & cmd.exe /c scripts\build_prototest.cmd
          if ($LASTEXITCODE -ne 0) { throw "build_prototest.cmd failed: $LASTEXITCODE" }
          & dist\prototest.exe
          if ($LASTEXITCODE -ne 0) { throw "prototest.exe failed: $LASTEXITCODE" }
          & dist\sessiontest.exe
          if ($LASTEXITCODE -ne 0) { throw "sessiontest.exe failed: $LASTEXITCODE" }

      - name: Validate harness contracts
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/Contract.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Contract.Tests.ps1 failed: $LASTEXITCODE" }

      - name: Exercise backup-first installer
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test_installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "test_installer.ps1 failed: $LASTEXITCODE" }

      - name: Build and assemble Release kit
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/make_mod_kit.ps1
          if ($LASTEXITCODE -ne 0) { throw "make_mod_kit.ps1 failed: $LASTEXITCODE" }

      - name: Verify distributable archive
        shell: pwsh
        run: |
          $zip = 'dist/KenshiCoop-kit.zip'
          if (-not (Test-Path $zip)) { throw "Missing archive: $zip" }
          $shaFile = 'dist/KenshiCoop-kit.zip.sha256'
          $installerZip = 'dist/KenshiCoop-installer.zip'
          if (-not (Test-Path $shaFile)) { throw "Missing archive checksum: $shaFile" }
          if (-not (Test-Path $installerZip)) { throw "Missing installer archive: $installerZip" }
          $expectedZipSha = ((Get-Content $shaFile -Raw).Trim() -split '\s+')[0].ToUpperInvariant()
          $actualZipSha = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($expectedZipSha -ne $actualZipSha) {
            throw "Kit checksum file $expectedZipSha does not match archive $actualZipSha"
          }

          $unpack = Join-Path $env:RUNNER_TEMP 'kenshi-coop-kit'
          Expand-Archive $zip $unpack -Force
          $required = @(
            'KenshiCoop/KenshiCoop.dll',
            'KenshiCoop/KenshiCoop.mod',
            'KenshiCoop/RE_Kenshi.json',
            'KenshiCoop/coop_config.json',
            'README.txt',
            'PROVENANCE.json'
          )
          foreach ($relative in $required) {
            $path = Join-Path $unpack $relative
            if (-not (Test-Path $path)) { throw "Archive is missing $relative" }
          }

          $provenance = Get-Content (Join-Path $unpack 'PROVENANCE.json') -Raw | ConvertFrom-Json
          $dllHash = (Get-FileHash (Join-Path $unpack 'KenshiCoop/KenshiCoop.dll') -Algorithm SHA256).Hash
          if ($dllHash -ne $provenance.dllSha256) {
            throw "Packaged DLL hash $dllHash does not match provenance $($provenance.dllSha256)"
          }
          Write-Host "Verified protocol $($provenance.protocolVersion), DLL SHA-256 $dllHash"

          $installerUnpack = Join-Path $env:RUNNER_TEMP 'kenshi-coop-installer'
          Expand-Archive $installerZip $installerUnpack -Force
          foreach ($name in @('Install-KenshiCoop.cmd', 'Install-KenshiCoop-Playtest.cmd', 'Install-KenshiCoop.ps1')) {
            if (-not (Test-Path (Join-Path $installerUnpack $name))) {
              throw "Installer archive is missing $name"
            }
          }

      - name: Upload KenshiCoop kit
        uses: actions/upload-artifact@v4
        with:
          name: KenshiCoop-kit-${{ github.sha }}
          path: |
            dist/KenshiCoop-kit.zip
            dist/KenshiCoop-kit.zip.sha256
            dist/KenshiCoop-installer.zip
          if-no-files-found: error
          retention-days: 30


  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-kit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: KenshiCoop-kit-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "$GITHUB_REF_NAME"
            release-assets/KenshiCoop-kit.zip
            release-assets/KenshiCoop-kit.zip.sha256
            release-assets/KenshiCoop-installer.zip
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "KenshiCoop $GITHUB_REF_NAME"
          )
          notes="Extract KenshiCoop-installer.zip once, then run Install-KenshiCoop.cmd. Keep that folder and run the same launcher to update. RE_Kenshi 0.3.4+ remains required."
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease --latest=false)
            notes="Playtest build: extract KenshiCoop-installer.zip once, then run Install-KenshiCoop-Playtest.cmd. Every player must use the playtest channel and the same protocol. Keep that folder and rerun the launcher to update. RE_Kenshi 0.3.4+ remains required."
          fi
          args+=(--notes "$notes")
          gh release create "${args[@]}"

  release-installer-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.releaseSmoke
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out installer
        uses: actions/checkout@v4

      - name: Double-click path installs and reruns without churn
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'kenshi-installer-release-smoke'
          $programFiles = Join-Path $fixture 'Program Files (x86)'
          $game = Join-Path $programFiles 'Steam\steamapps\common\Kenshi'
          $localAppData = Join-Path $fixture 'LocalAppData'
          New-Item -ItemType Directory -Force -Path (Join-Path $game 'mods') | Out-Null
          New-Item -ItemType Directory -Force -Path $localAppData | Out-Null
          Set-Content (Join-Path $game 'kenshi_x64.exe') 'fixture' -Encoding ASCII
          ${env:ProgramFiles(x86)} = $programFiles
          $env:ProgramFiles = (Join-Path $fixture 'Program Files')
          $env:LOCALAPPDATA = $localAppData

          $launcher = Join-Path $PWD 'scripts\Install-KenshiCoop.cmd'
          $launcherCommand = "`"$launcher`" < nul"
          & cmd.exe /d /c $launcherCommand
          if ($LASTEXITCODE -ne 0) { throw "fresh launcher install failed: $LASTEXITCODE" }

          $mod = Join-Path $game 'mods\KenshiCoop'
          foreach ($name in @('KenshiCoop.dll', 'KenshiCoop.mod', 'RE_Kenshi.json', 'coop_config.json')) {
            if (-not (Test-Path (Join-Path $mod $name))) { throw "fresh install is missing $name" }
          }
          $firstDll = (Get-FileHash (Join-Path $mod 'KenshiCoop.dll') -Algorithm SHA256).Hash
          $custom = '{ "hostAuthority": true, "maxPlayers": 12, "releaseSmoke": true }'
          Set-Content (Join-Path $mod 'coop_config.json') $custom -Encoding UTF8
          $customHash = (Get-FileHash (Join-Path $mod 'coop_config.json') -Algorithm SHA256).Hash

          & cmd.exe /d /c $launcherCommand
          if ($LASTEXITCODE -ne 0) { throw "launcher update failed: $LASTEXITCODE" }
          $secondDll = (Get-FileHash (Join-Path $mod 'KenshiCoop.dll') -Algorithm SHA256).Hash
          $secondConfig = (Get-FileHash (Join-Path $mod 'coop_config.json') -Algorithm SHA256).Hash
          $backups = if (Test-Path (Join-Path $localAppData 'KenshiCoop\backups')) {
            @(Get-ChildItem (Join-Path $localAppData 'KenshiCoop\backups') -Directory)
          } else {
            @()
          }
          if ($firstDll -ne $secondDll) { throw 'same latest release produced a different DLL' }
          if ($customHash -ne $secondConfig) { throw 'release updater did not preserve coop_config.json' }
          if ($backups.Count -ne 0) { throw "same latest release should not create a backup, found $($backups.Count)" }
          Write-Host 'RELEASE INSTALLER RESULT PASS source=github-latest entry=cmd fresh=1 rerun=noop config=preserved'