name: Smoke test published installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-latest-release:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out installer
        uses: actions/checkout@v4

      - name: Double-click path downloads, installs, backs up, and updates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'kenshi-installer-release-smoke'
          $programFiles = Join-Path $fixture 'Program Files (x86)'
          $game = Join-Path $programFiles 'Steam\steamapps\common\Kenshi'
          $localAppData = Join-Path $fixture 'LocalAppData'
          New-Item -ItemType Directory -Force -Path (Join-Path $game 'mods') | Out-Null
          New-Item -ItemType Directory -Force -Path $localAppData | Out-Null
          Set-Content (Join-Path $game 'kenshi_x64.exe') 'fixture' -Encoding ASCII
          ${env:ProgramFiles(x86)} = $programFiles
          $env:ProgramFiles = (Join-Path $fixture 'Program Files')
          $env:LOCALAPPDATA = $localAppData

          $launcher = Join-Path $PWD 'scripts\Install-KenshiCoop.cmd'
          & cmd.exe /d /c "echo.^|`"$launcher`""
          if ($LASTEXITCODE -ne 0) { throw "fresh launcher install failed: $LASTEXITCODE" }

          $mod = Join-Path $game 'mods\KenshiCoop'
          foreach ($name in @('KenshiCoop.dll', 'KenshiCoop.mod', 'RE_Kenshi.json', 'coop_config.json')) {
            if (-not (Test-Path (Join-Path $mod $name))) { throw "fresh install is missing $name" }
          }
          $firstDll = (Get-FileHash (Join-Path $mod 'KenshiCoop.dll') -Algorithm SHA256).Hash
          $custom = '{ "hostAuthority": true, "maxPlayers": 12, "releaseSmoke": true }'
          Set-Content (Join-Path $mod 'coop_config.json') $custom -Encoding UTF8
          $customHash = (Get-FileHash (Join-Path $mod 'coop_config.json') -Algorithm SHA256).Hash

          & cmd.exe /d /c "echo.^|`"$launcher`""
          if ($LASTEXITCODE -ne 0) { throw "launcher update failed: $LASTEXITCODE" }
          $secondDll = (Get-FileHash (Join-Path $mod 'KenshiCoop.dll') -Algorithm SHA256).Hash
          $secondConfig = (Get-FileHash (Join-Path $mod 'coop_config.json') -Algorithm SHA256).Hash
          $backups = @(Get-ChildItem (Join-Path $localAppData 'KenshiCoop\backups') -Directory)
          if ($firstDll -ne $secondDll) { throw 'same latest release produced a different DLL' }
          if ($customHash -ne $secondConfig) { throw 'release updater did not preserve coop_config.json' }
          if ($backups.Count -ne 1) { throw "expected one update backup, found $($backups.Count)" }
          if ((Get-FileHash (Join-Path $backups[0].FullName 'KenshiCoop.dll') -Algorithm SHA256).Hash -ne $firstDll) {
            throw 'release update backup does not contain the prior DLL'
          }
          Write-Host 'RELEASE INSTALLER RESULT PASS source=github-latest entry=cmd fresh=1 update=1 backup=verified config=preserved'
